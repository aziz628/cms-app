services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app 
      - /app/node_modules
    env_file:
      - ./server/.env.development 
    command: >
      sh -c "
      npm run migrate && 
      tailwindcss -i ./public/css/input.css -o ./public/css/output.css --watch & 
      npm run dev
      "
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    command: > #force vite server to listen on all interfaces using --host flag
      sh -c "
      tailwindcss -i ./src/index.css -o ./src/assets/css/output.css &&
      tailwindcss -i ./src/index.css -o ./src/assets/css/output.css --watch & 
      npm run dev -- --host 
      "