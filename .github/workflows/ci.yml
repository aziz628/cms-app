name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    name: Server Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Initialize Environment Files
        run: node setup.js

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Jest Tests
        working-directory: ./server
        run: npm test

  build-proof:
    name: Docker Production Build
    needs: test-server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -f Dockerfile.prod -t gym-cms:latest .
