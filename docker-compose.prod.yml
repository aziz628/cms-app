
services:
  gym-cms:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: gym-cms-prod
    ports:
      - "3000:3000"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs
      - ./server/data:/app/data
      - ./server/DB:/app/DB
    environment:
      - NODE_ENV=production
    command: >
      sh -c "
      npm run migrate &&
      npm run prod:start
      "